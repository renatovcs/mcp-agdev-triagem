[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "triagem-proposta"
version = "1.0.0"
description = "Skill MCP de triagem determinística de propostas de crédito rural (AgDev)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Renato Curvelo" }]
dependencies = [
    "mcp>=1.28,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
triagem-proposta = "triagem_proposta.server:main"
triagem-cli = "triagem_proposta.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/triagem_proposta"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/README.md",
    "/SKILL.md",
    "/DESIGN.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["triagem_proposta"]
branch = true
