services:
  triagem-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: triagem-proposta-mcp:latest
    container_name: triagem-mcp-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MCP_TRANSPORT=sse
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
